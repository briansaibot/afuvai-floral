# Hourly: AmiDayne's 48-hour note and the 72-hour hold expiry for wedding proposals.
# (Autopay reminders and charges run once a day from the Vercel cron in vercel.json, protected by CRON_SECRET.)
name: weddings-holds
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run hold checks
        run: curl -fsS -m 60 https://www.afuvai.com/api/weddings/cron/holds
